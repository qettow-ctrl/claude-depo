name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: ./gradlew assembleDebug

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk Hatirla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hatirla-apk
          path: Hatirla.apk

      - name: Son sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Hatırla (son sürüm)
          body: |
            Telefonuna kurmak için aşağıdaki **Hatirla.apk** dosyasına dokun.
            Derlenen commit: ${{ github.sha }}
          make_latest: true
          files: Hatirla.apk
